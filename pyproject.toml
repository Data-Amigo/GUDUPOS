[project]
name = "pos-stock"
version = "0.2.0"
description = "Phone-first POS, stock and M-Pesa reconciliation for Kenyan hotels and eateries"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "psycopg[binary]>=3.1",
  "pdfplumber>=0.11",
  "python-multipart>=0.0.9",
]

[tool.vercel]
# Vercel: the FastAPI instance is `app` in app/main.py
entrypoint = "app.main:app"
